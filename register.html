<div class="position-relative" style="padding-top: 68px;">
    <img src="Images/Register.png" class="img-fluid w-100" style="height:150vh;">
    <div class="position-absolute" style="top: 0px; right: 30px; padding-top: 68px;">
<h2 class="text-center fw-bold mt-2 pt-4">Create Your Account</h2>
<div style="display: flex; justify-content: start;">
<div class="ms-5 me-5 mt-4 pt-4 pb-4 rounded" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); width: 600px; display: flex; justify-content: center; background-color: white;">
  <form action="submit" class="text-center">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="fullName" class="form-label fw-bold">Full Name :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Enter your Full Name" aria-label="Full name" id="fullName"></td>
      </tr>
      <tr>
        <td><label for="username" class="form-label fw-bold">Username :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Choose a Username" aria-label="Username" id="username"></td>
      </tr>
      <tr>
        <td><label for="email" class="form-label fw-bold">Email Address :</label></td>
        <td><input type="email" class="form p-2 rounded" id="email" aria-label="Email address" placeholder="Enter your Email Address"></td>
      </tr>
      <tr>
        <td><label for="contact" class="form-label fw-bold">Phone Number :</label></td>
        <td><input type="tel" maxlength="10" class="form p-2 rounded" placeholder="Enter your Phone Number" aria-label="Phone number" id="contact"></td>
      </tr>
      <tr>
        <td><label for="dob" class="form-label fw-bold">Date of Birth :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Date of Birth" id="dob"></td>
      </tr>
      <tr>
        <td><label for="gender" class="form-label fw-bold">Gender :</label></td>
        <td><select class="form p-2 rounded" aria-label="Gender">
              <option selected>Select your Gender</option>
              <option value="1">Male</option>
              <option value="2">Female</option>
              <option value="3">Other</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="bloodgroup" class="form-label fw-bold">Blood Group :</label></td>
        <td><select class="form p-2 rounded" aria-label="Blood group">
              <option selected>Select your Blood Group</option>
              <option value="1">O-</option>
              <option value="2">O+</option>
              <option value="3">B-</option>
              <option value="4">B+</option>
              <option value="5">A-</option>
              <option value="6">A+</option>
              <option value="7">AB-</option>
              <option value="8">AB+</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="password" class="form-label fw-bold">Password :</label></td>
        <td><input type="password" id="password" class="form p-2 rounded" aria-label="Password" placeholder="Create a Password"></td>
      </tr>
      <tr>
        <td><label for="confirmpassword" class="form-label fw-bold">Confirm Password :</label></td>
        <td><input type="password" class="form p-2 rounded" placeholder="Confirm your Password" aria-label="Confirm password" id="confirmpassword"></td>
      </tr>
      <tr>
        <td><label for="city" class="form-label fw-bold">City :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Enter your City" aria-label="City" id="city"></td>
      </tr>
      <tr>
        <td><label for="pin" class="form-label fw-bold">Pin :</label></td>
        <td><input type="text" maxlength="6" pattern="[0-9]{6}" class="form p-2 rounded" placeholder="Enter Pincode" aria-label="Pin" id="pin"></td>
      </tr>
      <tr>
        <td><label for="fullName" class="form-label fw-bold">Role :</label></td>
        <td><select class="form p-2 rounded" aria-label="Role">
              <option selected>Select your Role</option>
              <option value="1">Patient</option>
              <option value="2">Donor</option>
            </select></td>
      </tr>
    </table>
    <label style="display: flex; flex-direction: row; justify-content: start;" class="ms-5">
            <input type="checkbox" id="terms" style="width: 15px; height: 15px; margin-right: 10px; margin-top: 5px; border: 1px solid rgb(218, 214, 214);">I agree to the <strong class="text-danger ms-1 me-1">Terms of Use</strong> and <strong class="text-danger ms-1 me-1">Privacy Policy</strong>
    </label>
    <button type="button" class="btn btn-danger" style="margin-top: 20px; width: 485px;"><i class="bi bi-person-plus-fill me-2"></i>Register</button>
    <p style="margin-top: 20px;">Already have an account? <a href="login.html" class="text-danger fw-bold ms-1" style="text-decoration: none";>Login</a></p>
  </form>
