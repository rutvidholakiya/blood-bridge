<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      textarea:focus,select:focus,input.form:focus {
    border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
textarea, select, input.form{
  border: 1px solid rgb(218, 214, 214);
  margin-bottom: 17px;
  width: 300px;
}
input[type="checkbox"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
input[type="radio"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
label{
    width: 200px;
}
.container-fluid a{
 margin-top: 15px;
}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg pt-0 pb-0 fixed-top bg-white">
  <div class="container-fluid">
    <img src="{{ url_for('static', filename='Images/Logo.png') }}" alt="logo" style="width: 180px; height: 60px; margin-top: 8px; padding-bottom: 8px; margin-left: 40px; background: transparent;">
    <ul class="nav justify-content-end">
  <li class="nav-item">
    <p><a class="nav-link fs-6 border border-2 border-danger me-2 rounded bg-danger text-white" style="height: 40px; padding-top: 6px;  margin-top: 15px;" href="{{ url_for('donor') }}">Back</a></p>
  </li>
</ul>
  </div>
</nav>
<div class="bg-white" style="height: 106vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding-top: 60px;">
<h2 class="text-center fw-bold text-danger">Update your Profile</h2>
<div class="pt-4 pb-4 rounded" style="margin-top: 40px; box-shadow: 0 0 15px rgba(57, 24, 24, 0.3); width: 600px; background-color: white;">
  <form action="{{ url_for('update_donor') }}" method="POST" style="display: flex; flex-direction: column; justify-content: center;">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="fullName" class="form-label fw-bold">Full Name :</label></td>
        <td><input type="text" class="form p-2 rounded" value="{{ user[1] }}" aria-label="Full name" id="fullName" name="fullName" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="bloodgroup" class="form-label fw-bold">Blood Group :</label></td>
        <td><input type="text" class="form p-2 rounded" value="{{ user[7] }}" aria-label="Blood group" id="bloodgroup" name="bloodgroup" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="dob" class="form-label fw-bold">Date of Birth :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Date of Birth" value="{{ user[5] }}" id="dob" name="dob" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="email" class="form-label fw-bold">Email Address :</label></td>
        <td><input type="email" class="form p-2 rounded" id="email" name="email" value="{{ user[3] }}" aria-label="Email address" placeholder="Enter your Email Address" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="contact" class="form-label fw-bold">Phone Number :</label></td>
        <td><input type="tel" maxlength="10" class="form p-2 rounded" value="{{ user[4] }}" placeholder="Enter your Phone Number" aria-label="Phone number" id="contact" name="contact"></td>
      </tr>
      <tr>
        <td><label for="gender" class="form-label fw-bold">Gender :</label></td>
        <td><input type="text" class="form p-2 rounded" value="{{ user[6] }}" aria-label="Gender" id="gender" name="gender" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="city" class="form-label fw-bold">City :</label></td>
        <td><select class="form p-2 rounded" aria-label="City" id="city" name="city" value="{{ user[9] }}">
    <option value="" selected>Select your City</option>
    <option value="Ahmedabad">Ahmedabad</option>
    <option value="Bengaluru">Bengaluru</option>
    <option value="Bhavnagar">Bhavnagar</option>
    <option value="Bhubaneswar">Bhubaneswar</option>
    <option value="Chennai">Chennai</option>
    <option value="Coimbatore">Coimbatore</option>
    <option value="Delhi">Delhi</option>
    <option value="Gandhinagar">Gandhinagar</option>
    <option value="Hyderabad">Hyderabad</option>
    <option value="Jaipur">Jaipur</option>
    <option value="Jamnagar">Jamnagar</option>
    <option value="Junagadh">Junagadh</option>
    <option value="Kanpur">Kanpur</option>
    <option value="Kolkata">Kolkata</option>
    <option value="Lucknow">Lucknow</option>
    <option value="Mumbai">Mumbai</option>
    <option value="Mysuru">Mysuru</option>
    <option value="Nagpur">Nagpur</option>
    <option value="Nashik">Nashik</option>
    <option value="Patna">Patna</option>
    <option value="Pune">Pune</option>
    <option value="Rajkot">Rajkot</option>
    <option value="Surat">Surat</option>
    <option value="Vadodara">Vadodara</option>
</select></td>
      </tr>
      <tr>
        <td><label for="pin" class="form-label fw-bold">Pin :</label></td>
        <td><input type="text" maxlength="6" pattern="[0-9]{6}" value="{{ user[10] }}" class="form p-2 rounded" placeholder="Enter Pincode" aria-label="Pin" id="pin" name="pin"></td>
      </tr>
    </table>
    <button type="submit" class="btn btn-danger ms-5" style="margin-top: 15px; width: 503px;"><i class="bi bi-arrow-clockwise me-2"></i>Update</button>
  </form>
</div>
</div>
<p class="text-center text-white bg-danger pt-3 pb-3 mb-0 mt-4" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);">© Blood Bridge. All rights reserved.</p>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
