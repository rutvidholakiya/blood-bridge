<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
    <style>
      select:focus,input.form:focus {
    border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
select, input.form{
  border: 1px solid rgb(218, 214, 214);
  margin-left: 35px;
  margin-bottom: 20px;
  width: 300px;
}
input[type="checkbox"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg pt-0 pb-0 fixed-top bg-white">
  <div class="container-fluid">
    <img src="{{ url_for('static', filename='Images/Logo.png') }}" alt="logo" style="width: 180px; height: 60px; margin-top: 8px; padding-bottom: 8px; margin-left: 40px;">
    <ul class="nav justify-content-end">
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('home') }}">Home</a>
  </li>
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('about') }}">About Us</a>
  </li>
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('mission') }}">Our Mission</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('find_donor') }}">Find Donor</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('request_blood') }}">Request Blood</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('donor') }}">Become Donor</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('contact') }}">Contact Us</a>
  </li>
</ul>
  </div>
</nav>
<div class="position-relative" style="padding-top: 68px;">
    <img src="{{ url_for('static', filename='Images/Register.png') }}" class="img-fluid w-100" style="height:165vh;">
    <div class="position-absolute" style="top: 0px; right: 30px; padding-top: 68px;">
<h2 class="text-center fw-bold mt-2 pt-4">Create Your Account</h2>
<div style="display: flex; justify-content: start;">
<div class="ms-5 me-5 mt-4 pt-4 pb-4 rounded" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); width: 600px; display: flex; justify-content: center; background-color: white;">
  <form action="{{ url_for('submit') }}" method="POST" onsubmit="return validateForm()">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="fullName" class="form-label fw-bold">Full Name :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Enter your Full Name" aria-label="Full name" id="fullname" name="fullname"></td>
      </tr>
      <tr>
        <td><label for="username" class="form-label fw-bold bg-white">Username :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Choose a Username" aria-label="Username" id="username" name="username"></td>
      </tr>
      <tr>
        <td><label for="email" class="form-label fw-bold">Email Address :</label></td>
        <td><input type="email" class="form p-2 rounded" id="email" name="email" aria-label="Email address" placeholder="Enter your Email Address"></td>
      </tr>
      <tr>
        <td><label for="contact" class="form-label fw-bold">Phone Number :</label></td>
        <td><input type="tel" maxlength="10" class="form p-2 rounded" placeholder="Enter your Phone Number" aria-label="Phone number" id="contact" name="contact"></td>
      </tr>
      <tr>
        <td><label for="dob" class="form-label fw-bold">Date of Birth :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Date of Birth" id="dob" name="dob"></td>
      </tr>
      <tr>
        <td><label for="gender" class="form-label fw-bold">Gender :</label></td>
        <td><select class="form p-2 rounded" aria-label="Gender" id="gender" name="gender">
              <option value="" selected>Select your Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="bloodgroup" class="form-label fw-bold">Blood Group :</label></td>
        <td><select class="form p-2 rounded" aria-label="Blood group" id="bloodgroup" name="bloodgroup">
              <option value="" selected>Select your Blood Group</option>
              <option value="O-">O-</option>
              <option value="O+">O+</option>
              <option value="B-">B-</option>
              <option value="B+">B+</option>
              <option value="A-">A-</option>
              <option value="A+">A+</option>
              <option value="AB-">AB-</option>
              <option value="AB+">AB+</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="password" class="form-label fw-bold">Password :</label></td>
        <td><input type="password" id="password" name="password" class="form p-2 rounded" aria-label="Password" placeholder="Create a Password"></td>
      </tr>
      <tr>
        <td><label for="confirmpassword" class="form-label fw-bold">Confirm Password :</label></td>
        <td><input type="password" class="form p-2 rounded" placeholder="Confirm your Password" aria-label="Confirm password" id="confirmpassword" name="confirmpassword"></td>
      </tr>
      <tr>
        <td><label for="state" class="form-label fw-bold">State :</label></td>
        <td><select class="form p-2 rounded" aria-label="State" id="state" name="state">
              <option value="" selected >Select your State</option>
    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="city" class="form-label fw-bold">City :</label></td>
        <td><select class="form p-2 rounded" aria-label="City" id="city" name="city">
    <option value="" selected>Select your City</option>
    <option value="Ahmedabad">Ahmedabad</option>
    <option value="Bengaluru">Bengaluru</option>
    <option value="Bhavnagar">Bhavnagar</option>
    <option value="Bhubaneswar">Bhubaneswar</option>
    <option value="Chennai">Chennai</option>
    <option value="Coimbatore">Coimbatore</option>
    <option value="Delhi">Delhi</option>
    <option value="Gandhinagar">Gandhinagar</option>
    <option value="Hyderabad">Hyderabad</option>
    <option value="Jaipur">Jaipur</option>
    <option value="Jamnagar">Jamnagar</option>
    <option value="Junagadh">Junagadh</option>
    <option value="Kanpur">Kanpur</option>
    <option value="Kolkata">Kolkata</option>
    <option value="Lucknow">Lucknow</option>
    <option value="Mumbai">Mumbai</option>
    <option value="Mysuru">Mysuru</option>
    <option value="Nagpur">Nagpur</option>
    <option value="Nashik">Nashik</option>
    <option value="Patna">Patna</option>
    <option value="Pune">Pune</option>
    <option value="Rajkot">Rajkot</option>
    <option value="Surat">Surat</option>
    <option value="Vadodara">Vadodara</option>
</select></td>
      </tr>
      <tr>
        <td><label for="pin" class="form-label fw-bold">Pin :</label></td>
        <td><input type="text" maxlength="6" pattern="[0-9]{6}" class="form p-2 rounded" placeholder="Enter Pincode" aria-label="Pin" id="pin" name="pin"></td>
      </tr>
      <tr>
        <td><label for="role" class="form-label fw-bold">Role :</label></td>
        <td><select class="form p-2 rounded" aria-label="Role" id="role" name="role">
              <option value="" selected>Select your Role</option>
              <option value="Patient">Patient</option>
              <option value="Donor">Donor</option>
            </select></td>
      </tr>
    </table>
    <label style="display: flex; flex-direction: row; justify-content: start;" class="ms-5">
            <input type="checkbox" id="terms" style="width: 15px; height: 15px; margin-right: 10px; margin-top: 5px; border: 1px solid rgb(218, 214, 214);">I agree to the <strong class="text-danger ms-1 me-1">Terms of Use</strong> and <strong class="text-danger ms-1 me-1">Privacy Policy</strong>
    </label>
    <button type="submit" class="btn btn-danger ms-5" style="margin-top: 20px; width: 485px;"><i class="bi bi-person-plus-fill me-2"></i>Register</button>
    <p style="margin-top: 20px;" class="text-center">Already have an account? <a href="{{ url_for('login') }}" class="text-danger fw-bold ms-1" style="text-decoration: none">Login</a></p>
  </form>
</div>
</div>
</div>
<p class="text-center text-white bg-danger pt-3 pb-3 mb-0" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);">© Blood Bridge. All rights reserved.</p>
</div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
