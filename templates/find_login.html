<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
    <style>
      select:focus,input.form:focus {
    border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
select, input.form{
  border: 1px solid rgb(218, 214, 214);
  margin-left: 35px;
  margin-bottom: 20px;
  width: 300px;
}
input[type="checkbox"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg pt-0 pb-0 fixed-top bg-white">
  <div class="container-fluid">
    <img src="{{ url_for('static', filename='Images/Logo.png') }}" alt="logo" style="width: 180px; height: 60px; margin-top: 8px; padding-bottom: 8px; margin-left: 40px;">
    <ul class="nav justify-content-end">
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('home') }}">Home</a>
  </li>
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('about') }}">About Us</a>
  </li>
  <li class="nav-item">
    <a class="nav-link active fs-6 text-body-emphasis me-2" href="{{ url_for('mission') }}">Our Mission</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('find_donor') }}">Find Donors</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('request_blood') }}">Request Blood</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('donor') }}">Become Donor</a>
  </li>
  <li class="nav-item">
    <a class="nav-link text-body-emphasis fs-6 me-2" href="{{ url_for('contact') }}">Contact Us</a>
  </li>
</ul>
  </div>
</nav>
<div class="position-relative" style="padding-top: 68px;">
    <img src="{{ url_for('static', filename='Images/Login.png') }}" class="img-fluid w-100" style="height:100vh;">
    <div class="position-absolute" style="top: 80px; right: 200px; padding-top: 68px;">
<h2 class="text-center fw-bold mt-2 pt-4">Login To Your Account</h2>
<div style="display: flex; justify-content: start;">
<div class="ms-5 me-5 mt-4 pt-4 pb-4 rounded" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15); width: 550px; display: flex; justify-content: center; background-color: white;">
  <form action="/submit_loginfind" method="POST" onsubmit="return validateForm()" class="text-center">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="email" class="form-label fw-bold">Email Address :</label></td>
        <td><input type="email" class="form p-2 rounded" id="email" name="email" aria-label="Email address" placeholder="Enter your email address"></td>
      </tr>
      <tr>
        <td><label for="password" class="form-label fw-bold">Password :</label></td>
        <td><input type="password" id="password" name="password" class="form p-2 rounded" aria-label="Password" placeholder="Enter a password"></td>
      </tr>
    </table>
    <label style="display: flex; flex-direction: row; justify-content: start;" class="ms-5">
            <input type="checkbox" id="terms" style="width: 15px; height: 15px; margin-right: 10px; margin-top: 5px; border: 1px solid rgb(218, 214, 214);"><p> Remember me
                <a href="{{ url_for('forgot') }}" class="text-danger fw-bold" style="text-decoration: none; margin-left: 185px;">Forgot Password?</a>
            </p>

    </label>
    <button type="submit" class="btn btn-danger" style="margin-top: 8px; width: 457px;"><i class="bi bi-box-arrow-in-right me-2"></i>Login</button>
    <p style="margin-top: 20px;">Don't have an account? <a href="{{ url_for('register') }}" class="text-danger fw-bold ms-1" style="text-decoration: none;">Register</a></p>
  </form>
</div>
</div>
</div>
<p class="text-center text-white bg-danger pt-3 pb-3 mb-0" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);">© Blood Bridge. All rights reserved.</p>
</div>

  </body>
</html>
