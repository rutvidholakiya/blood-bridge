<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Update Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
      textarea:focus,select:focus,input.form:focus {
    border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
textarea, select, input.form{
  border: 1px solid rgb(218, 214, 214);
  margin-bottom: 17px;
  width: 300px;
}
input[type="checkbox"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
input[type="radio"]:focus{
  border-color: rgb(247, 135, 135);
    outline: none;
    box-shadow: 0 0 4px rgb(247, 135, 135);
}
label{
    width: 200px;
}
.container-fluid a{
 margin-top: 15px;
}
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg pt-0 pb-0 fixed-top bg-white">
  <div class="container-fluid">
    <img src="Images/Logo.png" alt="logo" style="width: 180px; height: 60px; margin-top: 8px; padding-bottom: 8px; margin-left: 40px; background: transparent;">
    <ul class="nav justify-content-end">
  <li class="nav-item">
    <p><a class="nav-link fs-6 border border-2 border-danger me-2 rounded bg-danger text-white" style="height: 40px; padding-top: 6px;  margin-top: 15px;" href="donor.html">Back</a></p>
  </li>
</ul>
  </div>
</nav>
<div class="bg-white" style="height: 130vh; display: flex; justify-content: center; align-items: center; padding-top: 60px;">
<form action="">
<h2 class="text-center fw-bold text-danger">Update your Profile</h2>
<div class="pt-4 pb-4 rounded" style="margin-top: 40px; box-shadow: 0 0 15px rgba(57, 24, 24, 0.3); width: 600px; background-color: white;">
  <form action="submit" style="display: flex; justify-content: center;">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="fullName" class="form-label fw-bold">Full Name :</label></td>
        <td><input type="text" class="form p-2 rounded" value="Patient Name" aria-label="Full name" id="fullName" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="bloodgroup" class="form-label fw-bold">Blood Group :</label></td>
        <td><input type="text" class="form p-2 rounded" value="Blood Group" aria-label="Blood group" id="bloodgroup" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="dob" class="form-label fw-bold">Date of Birth :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Date of Birth" id="dob" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="age" class="form-label fw-bold">Age :</label></td>
        <td><input type="number" class="form p-2 rounded" min="18" max="65" placeholder="Your Age" aria-label="Age" id="age"></td>
      </tr>
      <tr>
        <td><label for="email" class="form-label fw-bold">Email Address :</label></td>
        <td><input type="email" class="form p-2 rounded" id="email" aria-label="Email address" placeholder="Enter your Email Address"></td>
      </tr>
      <tr>
        <td><label for="contact" class="form-label fw-bold">Phone Number :</label></td>
        <td><input type="tel" maxlength="10" class="form p-2 rounded" placeholder="Enter your Phone Number" aria-label="Phone number" id="contact"></td>
      </tr>
      <tr>
        <td><label for="gender" class="form-label fw-bold">Gender :</label></td>
        <td><input type="text" class="form p-2 rounded" value="Gender" aria-label="Gender" id="gender" disabled readonly></td>
      </tr>
      <tr>
        <td><label for="city" class="form-label fw-bold">City :</label></td>
        <td><select class="form p-2 rounded" aria-label="City">
              <option selected>Select your City</option>
    <option>Ahmedabad</option>
    <option>Surat</option>
    <option>Vadodara</option>
    <option>Rajkot</option>
    <option>Bhavnagar</option>
    <option>Jamnagar</option>
    <option>Junagadh</option>
    <option>Gandhinagar</option>
    <option>Mumbai</option>
    <option>Pune</option>
    <option>Nagpur</option>
    <option>Nashik</option>
    <option>Delhi</option>
    <option>Jaipur</option>
    <option>Lucknow</option>
    <option>Kanpur</option>
    <option>Bengaluru</option>
    <option>Mysuru</option>
    <option>Chennai</option>
    <option>Coimbatore</option>
    <option>Hyderabad</option>
    <option>Kolkata</option>
    <option>Bhubaneswar</option>
    <option>Patna</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="pin" class="form-label fw-bold">Pin :</label></td>
        <td><input type="text" maxlength="6" pattern="[0-9]{6}" class="form p-2 rounded" placeholder="Enter Pincode" aria-label="Pin" id="pin"></td>
      </tr>
      <tr>
        <td><label for="lastdonationdate" class="form-label fw-bold">Last Donation Date :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Last donation date" id="lastdonationdate"></td>
      </tr>
      <tr>
        <td><label for="emergency" class="form-label fw-bold">Availability :</label></td>
        <td><input type="radio" id="emergency" class="me-2" name="emergency">Available <input type="radio" class="me-2 ms-5" id="emergency" name="emergency">Unavailable</td>
      </tr>
    </table>
    <button type="button" class="btn btn-danger ms-5" style="margin-top: 15px; width: 503px;"><i class="bi bi-arrow-clockwise me-2"></i>Update</button>
  </form>
</div>
</form>
</div>
<p class="text-center text-white bg-danger pt-3 pb-3 mb-0" style="box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);">© Blood Bridge. All rights reserved.</p>

  </body>
</html>
