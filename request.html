<div class="bg-white" style="height: 120vh; display: flex; flex-direction: column;  justify-content: center; align-items: center; padding-top: 50px;">
<h2 class="text-center fw-bold text-danger">Request Blood</h2>
<div class="pt-4 pb-4 rounded" style="margin-top: 40px; box-shadow: 0 0 15px rgba(57, 24, 24, 0.3); width: 600px; background-color: white;">
  <form action="submit" style="display: flex; flex-direction: column; justify-content: center;">
    <table style="text-align: justify;" class="ms-5 me-5">
      <tr>
        <td><label for="patientname" class="form-label fw-bold">Patient Name :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Enter Patient Name" aria-label="Patient name" id="patientname"></td>
      </tr>
      <tr>
        <td><label for="bloodgroup" class="form-label fw-bold">Blood Group :</label></td>
        <td><select class="form p-2 rounded" aria-label="Blood group">
              <option selected>Select your Blood Group</option>
              <option value="1">O-</option>
              <option value="2">O+</option>
              <option value="3">B-</option>
              <option value="4">B+</option>
              <option value="5">A-</option>
              <option value="6">A+</option>
              <option value="7">AB-</option>
              <option value="8">AB+</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="hospitalname" class="form-label fw-bold">Hospital Name :</label></td>
        <td><input type="text" class="form p-2 rounded" placeholder="Enter Hospital Name" aria-label="Hospital name" id="hospitalname"></td>
      </tr>
      <tr>
        <td><label for="hospitaladdress" class="form-label fw-bold">Hospital Address :</label></td>
        <td><textarea name="hospitaladdress" id="hospitaladdress" class="p-2 rounded" placeholder="Enter Hospital Address"></textarea></td>
      </tr>
      <tr>
        <td><label for="city" class="form-label fw-bold">City :</label></td>
        <td><select class="form p-2 rounded" aria-label="City">
              <option selected>Select your City</option>
    <option>Ahmedabad</option>
    <option>Surat</option>
    <option>Vadodara</option>
    <option>Rajkot</option>
    <option>Bhavnagar</option>
    <option>Jamnagar</option>
    <option>Junagadh</option>
    <option>Gandhinagar</option>
    <option>Mumbai</option>
    <option>Pune</option>
    <option>Nagpur</option>
    <option>Nashik</option>
    <option>Delhi</option>
    <option>Jaipur</option>
    <option>Lucknow</option>
    <option>Kanpur</option>
    <option>Bengaluru</option>
    <option>Mysuru</option>
    <option>Chennai</option>
    <option>Coimbatore</option>
    <option>Hyderabad</option>
    <option>Kolkata</option>
    <option>Bhubaneswar</option>
    <option>Patna</option>
            </select></td>
      </tr>
      <tr>
        <td><label for="contact" class="form-label fw-bold">Phone Number :</label></td>
        <td><input type="tel" maxlength="10" class="form p-2 rounded" placeholder="Enter your Phone Number" aria-label="Phone number" id="contact"></td>
      </tr>
      <tr>
        <td><label for="unit" class="form-label fw-bold">Units :</label></td>
        <td><input type="number" min="1" max="10" class="form p-2 rounded" placeholder="Enter required Units" aria-label="Units" id="unit"></td>
      </tr>
      <tr>
        <td><label for="requireddate" class="form-label fw-bold">Required Date :</label></td>
        <td><input type="date" class="form p-2 rounded" aria-label="Required date" id="requireddate"></td>
      </tr>
      <tr>
        <td><label for="emergency" class="form-label fw-bold">Emergency :</label></td>
        <td><input type="radio" id="emergency" class="me-2" name="emergency">Yes <input type="radio" class="me-2 ms-5" id="emergency" name="emergency">No</td>
      </tr>
    </table>
    <button type="button" class="btn btn-danger ms-5" style="margin-top: 15px; width: 503px;"><i class="bi bi-droplet-fill me-3"></i>Send Request</button>
  </form>
</div>
